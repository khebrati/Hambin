<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<div id="root"></div>
<script type="module">
  import React, { useState } from 'react';
  import { createRoot } from 'react-dom/client';
  import { VideoPlayer } from '../src/components/VideoPlayer';
  import '../src/styles.css';
  const params = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = params.get('theme') || 'light';
  document.documentElement.dataset.textScale = params.get('largeText') === '1' ? 'large' : 'standard';
  document.documentElement.dir = params.get('dir') || 'ltr';
  window.playerActions = [];
  window.playerReports = [];
  function Fixture() {
    const [source, setSource] = useState(params.get('url') || 'https://media.example.test/movie.mp4');
    const [syncTarget, setSyncTarget] = useState();
    window.replacePlayerSource = setSource;
    window.syncPlayerTo = (positionMs) => setSyncTarget({ requestId: crypto.randomUUID(), positionMs });
    const [micMuted, setMicMuted] = useState(true);
    const [notice, setNotice] = useState('');
    return React.createElement(React.Fragment, null,
      React.createElement(VideoPlayer, {
        url: source, syncTarget,
        sessionId: 'player-test', onReport(positionMs, playing) { window.playerReports.push({ positionMs, playing }); }, onNotify: setNotice,
        micMuted,
        onToggleMic() { window.playerActions.push('mic'); setMicMuted(value => !value); },
        onSync() { window.playerActions.push('sync'); },
      }),
      notice && React.createElement('p', { role: 'status', 'data-testid': 'player-notice' }, notice));
  }
  createRoot(document.getElementById('root')).render(React.createElement(Fixture));
</script>
</body></html>
