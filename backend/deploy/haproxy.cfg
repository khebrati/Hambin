# TLS is terminated by Caddy or Coturn, selected from the unencrypted SNI.
# https://www.haproxy.com/documentation/haproxy-configuration-manual/latest/#7.3.5-req.ssl_sni
global
    user haproxy
    group haproxy
    log stdout format raw local0
    maxconn 20000
defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 2h
    timeout server 2h
frontend shared_https
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl is_turn req.ssl_sni -i "${TURN_DOMAIN}"
    use_backend turn_tls if is_turn
    default_backend website_tls
backend website_tls
    # Caddy's trusted PROXY listener restores client IPs for API rate limits.
    server caddy 127.0.0.1:8443 check send-proxy-v2
backend turn_tls
    server coturn 127.0.0.1:5349 check
